appId: dev.cipherkeep.app
productName: Cipherkeep
copyright: Cipherkeep contributors (MIT)
directories:
  output: ../../release
  buildResources: build
files:
  - dist/**/*
  - web/**/*
  - package.json
asar: true
npmRebuild: false
nodeGypRebuild: false
# Unsigned builds for now: see docs/PACKAGING.md for how to add signing and notarisation.
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch: universal
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  sign: false
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
linux:
  category: Education
  maintainer: Cipherkeep contributors <cipherkeep@users.noreply.github.com>
  synopsis: Offline cybersecurity learning notes
  target:
    - AppImage
    - deb
    - rpm
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
